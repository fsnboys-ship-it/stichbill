name: Access Foundation CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: stichbill_test
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: stichbill_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stichbill_test -d stichbill_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run ci:check
      - run: npm run build --workspace @stichbill/api
      - run: node scripts/setup-ci-db.mjs
        env:
          ADMIN_DATABASE_URL: postgresql://stichbill_test:ci-local-only@127.0.0.1:5432/stichbill_test
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: linux-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run ci:check
      - run: ./scripts/start-ci-postgres.ps1
        shell: pwsh
      - run: npm run build --workspace @stichbill/api
      - run: node scripts/setup-ci-db.mjs
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:ci-local-only@127.0.0.1:55432/stichbill_test
      - run: npm run verify
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: windows-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop native PostgreSQL
        if: always()
        shell: pwsh
        run: |
          $pgData = Join-Path $env:RUNNER_TEMP 'stichbill-postgres'
          if (Test-Path "$pgData\postmaster.pid") {
            & 'C:\Program Files\PostgreSQL\17\bin\pg_ctl.exe' -D $pgData -m fast -w stop
          }
