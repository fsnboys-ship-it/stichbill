# Install ONLY as /etc/systemd/system/postgresql@17-main.service.d/stichbill-data.conf
# Ubuntu cluster name must be verified with pg_lsclusters before installation.
[Unit]
RequiresMountsFor=/srv/stichbill_pgdata
AssertPathIsMountPoint=/srv/stichbill_pgdata
BindsTo=srv-stichbill_pgdata.mount
After=srv-stichbill_pgdata.mount
[Service]
ExecStartPre=/usr/bin/test -f /srv/stichbill_pgdata/17/main/PG_VERSION
