# TEMPLATE: replace staging.example.invalid and certificate paths before validation.
# Install as an http{} include. Run nginx -t before any reload.
limit_req_zone $binary_remote_addr zone=stich_auth:10m rate=10r/m;
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name staging.example.invalid;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/stichbill-acme; }
    location / { return 308 https://staging.example.invalid$request_uri; }
}
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl;
    server_name staging.example.invalid;
    ssl_certificate /etc/letsencrypt/live/staging.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/stichbill/current/apps/web/dist;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    # Do not add includeSubDomains/preload to a staging host.
    add_header Strict-Transport-Security "max-age=86400" always;
    # Never log request bodies, cookies, query strings or recovery fragments.
    access_log off;
    location ^~ /api/docs { return 404; }
    location = /api/v1/health/ready { return 404; }
    location /api/v1/auth/ {
        limit_req zone=stich_auth burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/stichbill-api.conf;
    }
    location /api/ { include /etc/nginx/snippets/stichbill-api.conf; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
